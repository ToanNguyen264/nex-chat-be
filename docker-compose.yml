services:
  mysql:
    image: mysql:8.4
    container_name: nex-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: nex
      MYSQL_USER: nex
      MYSQL_PASSWORD: nex_password
    ports:
      - "3307:3306"
    volumes:
      - nex_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13.4
    container_name: nex-chat-livekit
    command:
      - --config
      - /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  minio:
    image: elestio/minio:latest
    container_name: nex-minio
    restart: unless-stopped
    command:
      - server
      - --address
      - ":9000"
      - --console-address
      - ":9001"
      - /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - nex_minio_data:/data

  redis:
    image: redis:7.4-alpine
    container_name: nex-redis
    restart: unless-stopped #tự chạy lại khi container bị dừng hoặc lỗi

    environment: # đưa password vào biến môi trường để tránh lộ password trong command
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"

    command: #Append Only File tránh trường hợp mất dữ liệu khi container bị dừng hoặc lỗi
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - nex_redis_data:/data

    healthcheck:
      test: [
        "CMD-SHELL",
        'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG'
      ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nex_mysql_data:
  nex_minio_data:
    external: true #yêu cầu dùng lại container đã tồn tại không tạo mới nếu có
  nex_redis_data: # cài thêm thư viện BullMQ để lưu trữ dữ liệu của Redis