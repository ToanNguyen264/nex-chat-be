services:
  mysql:
    image: mysql:8.4
    container_name: nex-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: nex
      MYSQL_USER: nex
      MYSQL_PASSWORD: nex_password
    ports:
      - "3307:3306"
    volumes:
      - nex_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  nex_mysql_data: